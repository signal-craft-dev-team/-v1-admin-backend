name: Build and Deploy

on:
  push:
    branches: [main]

env:
  IMAGE_NAME: ghcr.io/signal-craft-dev-team/202606-v1-admin-backend

jobs:
  # ─────────────────────────────────────────
  # 1. Docker 빌드 & GHCR 푸시
  # ─────────────────────────────────────────
  build-and-push:
    name: Build & Push to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.10.0

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6.15.0
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────
  # 2. GCP VM 배포 (SSH)
  # ─────────────────────────────────────────
  deploy:
    name: Deploy to GCP VM
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.V1_GCP_VM_ADMIN_HOST }}
          username: ${{ secrets.V1_GCP_VM_USER }}
          key: ${{ secrets.V1_GCP_VM_SSH_KEY }}
          script: |
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin
            docker pull ${{ env.IMAGE_NAME }}:latest
            docker stop admin-backend 2>/dev/null || true
            docker rm   admin-backend 2>/dev/null || true
            docker run -d \
              --name admin-backend \
              --restart unless-stopped \
              -p 8000:8000 \
              ${{ env.IMAGE_NAME }}:latest
            docker image prune -f

  # ─────────────────────────────────────────
  # 3. Slack 알림
  # ─────────────────────────────────────────
  notify:
    name: Slack Notification
    runs-on: ubuntu-latest
    needs: [build-and-push, deploy]
    if: always()

    steps:
      - name: Prepare message data
        id: prep
        run: |
          # 커밋 메시지 첫 줄만 추출 후 JSON 안전하게 이스케이프
          COMMIT_MSG=$(echo "${{ github.event.head_commit.message }}" | head -1 | sed 's/"/\\"/g')
          echo "commit_msg=$COMMIT_MSG" >> $GITHUB_OUTPUT
          # 이미지 digest에서 sha256: 제거 후 앞 12자리만 사용
          DIGEST="${{ needs.build-and-push.outputs.digest }}"
          echo "short_digest=${DIGEST#sha256:}" >> $GITHUB_OUTPUT

      - name: Send Slack message
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "text": "${{ needs.deploy.result == 'success' && '✅ 배포 성공' || '❌ 배포 실패' }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "${{ needs.deploy.result == 'success' && ':white_check_mark: *배포 성공*' || ':x: *배포 실패*' }}\n*서비스:* admin-backend\n*브랜치:* `${{ github.ref_name }}`\n*작업자:* ${{ github.actor }}"
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*커밋 메시지*\n${{ steps.prep.outputs.commit_msg }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*커밋 SHA*\n<${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}|`${{ github.sha }}`>"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*이미지 SHA*\n`${{ steps.prep.outputs.short_digest }}`"
                    }
                  ]
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": { "type": "plain_text", "text": "워크플로우 보기" },
                      "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                    }
                  ]
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
